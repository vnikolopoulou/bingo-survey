*{box-sizing:border-box}body{margin:0;background:#F5F7F2;color:#26332D;font:17px/1.6 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;color:#245C48}.logo{font-size:42px;font-weight:850;letter-spacing:-2px}.tag{font-size:12px;letter-spacing:2px}progress{width:100%;height:8px;accent-color:#245C48}article{background:white;border:1px solid #dce5d9;border-radius:24px;padding:clamp(20px,5vw,42px);margin:20px 0}h1,h2{color:#245C48;line-height:1.2}h1{font-size:clamp(28px,5vw,42px)}fieldset{border:0;padding:0;margin:0 0 28px;min-width:0}legend{font-weight:700;margin-bottom:10px}label.option{display:flex;align-items:center;gap:12px;border:1px solid #dce5d9;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}label.option:has(input:checked){background:#e5efe5;border-color:#245C48}input{accent-color:#245C48;width:20px;height:20px;flex-shrink:0}button{font:inherit;font-weight:650;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:#245C48;color:white}button.secondary{background:#e3ebe0;color:#245C48}nav{display:flex;justify-content:space-between;gap:12px}small{display:block;color:#52665a;margin-bottom:10px}textarea{width:100%;min-height:120px;border:1px solid #91B89A;border-radius:12px;padding:12px;font:inherit}#map{height:330px;border-radius:12px;background:#e3ebe0}#error{color:#a12626}footer{font-size:13px;color:#52665a;text-align:center}.notice{background:#e3ebe0;padding:12px;border-radius:12px}button:focus-visible,input:focus-visible{outline:3px solid #91B89A;outline-offset:3px}.bingo-pin span{display:block;width:26px;height:26px;background:#245C48;border:2px solid white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 5px #0004}.bingo-pin span:after{content:"";position:absolute;width:8px;height:8px;background:white;border-radius:50%;top:7px;left:7px}</style></head><body><main><header><span class="logo">BinGo<span style="color:#91B89A">.</span></span><span class="tag">SMART CITIES · ΧΑΝΙΑ</span></header><progress id="progress" max="6" value="0"></progress><small id="step"></small><article id="content"></article><p id="error" role="alert"></p><nav><button class="secondary" id="back">← Πίσω</button><button id="next">Συνέχεια →</button></nav><footer>BinGo · Εκπαιδευτική έρευνα · Δοκιμαστική έκδοση</footer></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const sections=[{"title": "1. Γενικές πληροφορίες", "qs": [{"type": "select_one", "name": "age", "label": "Σε ποια ηλικιακή ομάδα ανήκετε;", "hint": null, "required": true, "options": [["v1", "18–30"], ["v2", "31–45"], ["v3", "46–60"], ["v4", "61–75"], ["v5", "Άνω των 75"], ["v6", "Δεν επιθυμώ να απαντήσω"]]}, {"type": "select_one", "name": "relation", "label": "Ποια είναι η σχέση σας με την πόλη των Χανίων;", "hint": null, "required": true, "options": [["v1", "Μόνιμος κάτοικος"], ["v2", "Προσωρινός κάτοικος / φοιτητής"], ["v3", "Εργάζομαι ή δραστηριοποιούμαι στην πόλη"], ["v4", "Επισκέπτομαι συχνά την πόλη"], ["v5", "Δεν έχω ιδιαίτερη σχέση"]]}, {"type": "select_one", "name": "household", "label": "Πόσα άτομα κατοικούν στο νοικοκυριό σας;", "hint": null, "required": true, "options": [["v1", "1"], ["v2", "2"], ["v3", "3–4"], ["v4", "5 ή περισσότερα"], ["v5", "Δεν επιθυμώ να απαντήσω"]]}]}, {"title": "2. Καθημερινή διαχείριση απορριμμάτων", "qs": [{"type": "select_one", "name": "frequency", "label": "Πόσο συχνά μεταφέρετε απορρίμματα στους δημόσιους κάδους;", "hint": null, "required": true, "options": [["v1", "Καθημερινά"], ["v2", "3–4 φορές την εβδομάδα"], ["v3", "1–2 φορές την εβδομάδα"], ["v4", "Λιγότερο συχνά"], ["v5", "Δεν τα μεταφέρω προσωπικά"]]}, {"type": "select_one", "name": "access", "label": "Πόσο εύκολη είναι για εσάς η πρόσβαση στον πλησιέστερο κάδο;", "hint": null, "required": true, "options": [["v1", "Πολύ εύκολη"], ["v2", "Σχετικά εύκολη"], ["v3", "Ούτε εύκολη ούτε δύσκολη"], ["v4", "Αρκετά δύσκολη"], ["v5", "Πολύ δύσκολη"], ["v6", "Δεν γνωρίζω"]]}, {"type": "select_multiple", "name": "barriers", "label": "Ποιες δυσκολίες αντιμετωπίζετε;", "hint": "Επιλέξτε όσες ισχύουν. Αν δεν αντιμετωπίζετε δυσκολία, επιλέξτε μόνο «Καμία δυσκολία».", "required": true, "options": [["v1", "Μεγάλη απόσταση"], ["v2", "Σκάλες ή απουσία ανελκυστήρα"], ["v3", "Ανώμαλο ή ανηφορικό έδαφος"], ["v4", "Περιορισμένη κινητικότητα"], ["v5", "Έλλειψη χρόνου"], ["v6", "Υποχρεώσεις : "select_multiple", "name": "availability", "label": "Πότε θα σας εξυπηρετούσε περισσότερο;", "hint": null, "required": true, "options": [["v1", "Καθημερινές πρωί"], ["v2", "Καθημερινές απόγευμα"], ["v3", "Σαββατοκύριακα"], ["v4", "Χωρίς σταθερή προτίμηση"]]}, {"type": "select_multiple", "name": "concerns", "label": "Τι θα σας προβλημάτιζε σχετικά με τον εθελοντισμό;", "hint": null, "required": true, "options": [["v1", "Υγιεινή"], ["v2", "Βάρος σακουλών"], ["v3", "Επαφή με αγνώστους"], ["v4", "Είσοδος σε κατοικίες"], ["v5", "Έλλειψη χρόνου"], ["v6", "Έλλειψη εξοπλισμού ή οδηγιών"], ["v7", "Κανένας ιδιαίτερος προβληματισμός"], ["v8", "Άλλο"]]}]}, {"title": "5. Τελικές απόψεις", "qs": [{"type": "select_one", "name": "priority", "label": "Αν τα αιτήματα ξεπερνούν τη διαθεσιμότητα εθελοντών, ποιο κριτήριο προτεραιότητας προτιμάτε;", "hint": null, "required": true, "options": [["v1", "Βαθμός ανάγκης"], ["v2", "Χρονική σειρά αιτημάτων"], ["v3", "Απόσταση από εθελοντή"], ["v4", "Συνδυασμός κριτηρίων"], ["v5", "Δεν γνωρίζω"]]}, {"type": "select_one", "name": "channel", "label": "Ποιος τρόπος υποβολής αιτήματος θα σας εξυπηρετούσε;", "hint": null, "required": true, "options": [["v1", "Εφαρμογή κινητού"], ["v2", "Ιστοσελίδα"], ["v3", "Τηλέφωνο"], ["v4", "Μέσω άλλου προσώπου"], ["v5", "Δεν έχω προτίμηση"]]}, {"type": "text", "name": "comments", "label": "Έχετε κάποια πρόταση ή παρατήρηση;", "hint": "Προαιρετικά. Μην αναφέρετε προσωπικά στοιχεία.", "required": false, "options": []}]}], intro="Στο πλαίσιο του μαθήματος «Έξυπνες Πόλεις» διερευνούμε μια εφαρμογή που συνδέει κατοίκους με εθελοντές για τη μεταφορά οικιακών απορριμμάτων στους κατάλληλους κάδους, για περιστασιακές ή μόνιμες ανάγκες. Περιοχή πιλοτικής εφαρμογής: πόλη Χανίων. Η συμμετοχή είναι προαιρετική. Δεν ζητούνται ονόματα, email ή διευθύνσεις. Μην καταχωρίζετε προσωπικά στοιχεία ή ακριβή θέση κατοικίας. Οι απαντήσεις χρησιμοποιούνται για την εκπαιδευτική εργασία.";let page=0, answers={},map=null,marker=null,circle=null;const $=id=>document.getElementById(id);const yes=v=>v==='v1'||v==='v2';const visible=q=> !(['local_offer','volunteer_pin','radius','time','availability'].includes(q.name)&&!yes(answers.volunteer)) && !( ['volunteer_pin','radius','time','availability'].includes(q.name)&&!yes(answers.local_offer)) && !(q.name==='radius'&&!answers.volunteer_pin);
function clearHidden(){for(const s of sections)for(const q of s.qs)if(!visible(q))delete answers[q.name]}
function render(){if(map){map.remove();map=null;marker=null;circle=null} $('error').textContent='';$('progress').value=page;$('step').textContent=page===0?'ΕΙΣΑΓΩΓΗ':page<=5?`ΕΝΟΤΗΤΑ ${page} / 5`:'ΟΛΟΚΛΗΡΩΣΗ';$('back').hidden=page===0;$('next').hidden=page===6;$('next').textContent=page===5?'Ολοκλήρωση →':'Συνέχεια →';let c=$('content');c.replaceChildren();if(page===0){c.innerHTML='<h1>Μια μικρή πράξη, μια μεγάλη αλλαγή στη γειτονιά.</h1><p>'+intro+'</p><p class="notice">Δοκιμαστική έκδοση: οι απαντήσεις δεν αποστέλλονται ούτε αποθηκεύονται σε διακομιστή. Ο χάρτης φορτώνεται από εξωτερική υπηρεσία.</p><p>Η έρευνα απευθύνεται σε ενήλικες.</p><label class="option"><input type="checkbox" id="consent"> Είμαι 18 ετών ή άνω και συμφωνώ να συμμετάσχω.</label>';$('consent').checked=!!answers.consent;$('consent').onchange=e=>answers.consent=e.target.checked;return}if(page===6){c.innerHTML='<h1>Σας ευχαριστούμε!</h1><p>Η δοκιμή ολοκληρώθηκε. Οι απαντήσεις δεν έχουν υποβληθεί ή αποθηκευτεί.</p><button id="restart">Νέα δοκιμή</button>';$('restart').onclick=()=>{answers={};page=0;render()};return}let s=sections[page-1];let h=document.createElement('h2');h.textContent=s.title;c.append(h);for(const q of s.qs){if(!visible(q))continue;let f=document.createElement('fieldset');let l=document.createElement('legend');l.textContent=q.label+(q.required?' *':'');f.append(l);if(q.hint){let sm=document.createElement('small');sm.textContent=q.hint;f.append(sm)}if(q.type==='geopoint'){let m=document.createElement('div');m.id='map';f.append(m);let b=document.createElement('button');b.type='button';b.className='secondary';b.textContent='Αφαίρεση πινέζας';b.onclick=()=>{delete answers.volunteer_pin;delete answers.radius;render()};f.append(b);c.append(f);continue}if(q.type==='text'){let a=document.createElement('textarea');a.value=answers[q.name]||'';a.oninput=()=>answers[q.name]=a.value;f.append(a)}else for(const [v,t] of q.options){let lab=document.createElement('label');lab.className='option';let a=document.createElement('input');a.type=q.type==='select_multiple'?'checkbox':'radio';a.name=q.name;a.value=v;a.checked=a.type==='checkbox'?(answers[q.name]||[]).includes(v):answers[q.name]===v;a.onchange=()=>{if(a.type==='checkbox'){let arr=answers[q.name]||[];arr=a.checked?[...arr,v]:arr.filter(x=>x!==v);if(['barriers','concerns'].includes(q.name)&&a.checked)arr=v==='v7'?['v7']:arr.filter(x=>x!=='v7');answers[q.name]=arr;for(const el of f.querySelectorAll('input'))el.checked=arr.includes(el.value)}else{answers[q.name]=v;if(['volunteer','local_offer'].includes(q.name)){clearHidden();render()}if(q.name==='radius')drawCircle()}};lab.append(a,document.createTextNode(t));f.append(lab)}c.append(f)}if($('map'))initMap()}
function initMap(){if(!window.L){$('map').textContent='Ο χάρτης δεν φορτώθηκε. Ελέγξτε τη σύνδεσή σας.';return}let p=answers.volunteer_pin;map=L.map('map').setView(p?[p.lat,p.lng]:[35.5138,24.0180],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);if(p)place(p);map.on('click',e=>{answers.volunteer_pin={lat:e.latlng.lat,lng:e.latlng.lng};render()})}
function place(p){marker=L.marker([p.lat,p.lng],{draggable:true,icon:L.divIcon({className:"bingo-pin",html:"<span></span>",iconSize:[28,36],iconAnchor:[14,34]})}).addTo(map);marker.on('dragend',()=>{let p=marker.getLatLng();answers.volunteer_pin={lat:p.lat,lng:p.lng};drawCircle()});drawCircle()}
function drawCircle(){if(!map)return;if(circle){circle.remove();circle=null}let p=answers.volunteer_pin;let opt=sections[3].qs.find(q=>q.name==='radius').options.find(x=>x[0]===answers.radius);if(!p||!opt)return;let n={"v1":100,"v2":300,"v3":500,"v4":1000}[opt[0]];if(n)circle=L.circle([p.lat,p.lng],{radius:n,color:'#245C48',weight:2,fillColor:'#91B89A',fillOpacity:0.22,interactive:false}).addTo(map)}
$('next').onclick=()=>{if(page===0&&!answers.consent){$('error').textContent='Απαιτείται συγκατάθεση για τη συνέχεια.';return}if(page>0&&page<=5){let missing=sections[page-1].qs.find(q=>visible(q)&&q.required&&(!answers[q.name]||answers[q.name].length===0));if(missing){$('error').textContent='Παρακαλούμε απαντήστε: '+missing.label;return}}page++;render();window.scrollTo(0,0)};$('back').onclick=()=>{page--;render();window.scrollTo(0,0)};render();</script></body></html>
